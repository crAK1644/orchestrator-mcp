[project]
name = "orchestrator-mcp"
version = "0.1.0"
description = "Capability-routed MCP server: route work to the LLM that is best at it."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "litellm>=1.55.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
orchestrator-mcp = "orchestrator_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
