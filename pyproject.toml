[project]
# `orchestrator-mcp` on PyPI is an empty registered project owned by someone
# else, so the distribution carries the `-server` suffix. The import package,
# the repo, and the config env var are unchanged.
name = "orchestrator-mcp-server"
version = "0.6.1"
description = "Let one coding-agent CLI consult another through Codex, Claude Code, OpenCode, or Antigravity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayberk Karataban" }]
keywords = ["mcp", "llm", "orchestrator", "claude", "codex", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    # 2.0 renamed the server API (`mcp.server.MCPServer`) and switched tool objects
    # to snake_case; 1.x will not import.
    "mcp>=2.0,<3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/crAK1644/orchestrator-mcp"
Issues = "https://github.com/crAK1644/orchestrator-mcp/issues"

[project.scripts]
orchestrator-mcp-server = "orchestrator_mcp.server:main"
# Opt-in and loopback-only: it serves stored history and can edit managed config.
orchestrator-mcp-dashboard = "orchestrator_mcp.consult.dashboard:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
# Only what this repo installs and runs. `.venv` is excluded by ruff already.
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default, because that default has
# widened across releases: the same `ruff check` that passed on one version fails
# on the next over style rules nobody chose. This is the classic default -- the
# pyflakes and pycodestyle-error rules that catch real mistakes -- plus import
# sorting, which is mechanical and has an exact fix.
#
# Deliberately not selected: `S` fires on every subprocess launch, and launching
# subprocesses is what this server is for; `ASYNC` objects to the same calls;
# `BLE` objects to the broad `except Exception` at each service boundary, which is
# how a crash becomes a structured error envelope instead of a dead session.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture requested by name shadows the module-level import of the same
# name, which is the documented way to use one and reads to pyflakes as a
# redefinition. Silencing it per-file beats a `noqa` on every test that takes a
# fixture.
"tests/*" = ["F811"]
