name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # SHA-pinned, like the release workflow: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          # Same pin as the release workflow, so the tests that gate a release run
          # under the uv that will build it. Checksum is the x86_64 linux tarball.
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
      - run: uv sync --all-extras --dev

      # Without a confinement mechanism, `sandbox.mechanism()` is None on this host and
      # the escape suite skips itself -- so CI would report green having proven nothing
      # about the sandbox. The argv tests do not even skip: they need a real mechanism
      # to build the wrapper.
      #
      # Unprivileged user namespaces are AppArmor-restricted on Ubuntu 24.04 runners,
      # and bubblewrap needs them. The sysctl is tolerated as absent because an older
      # runner image does not have the knob and does not need it.
      - name: Install a sandbox mechanism
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Proves the mechanism holds before the suite decides to skip past it.
      - name: Refuse to test without one
        run: |
          uv run python -c "
          from orchestrator_mcp.code import sandbox
          if not sandbox.holds():
              raise SystemExit(f'no sandbox on this runner: {sandbox.unavailable_reason()}')
          print(f'sandbox: {sandbox.mechanism()}')
          "

      # No network: every deployment is stubbed, so this needs no API keys.
      - run: uv run pytest -q

  # Separate from the matrix: the rules are the same on every interpreter, so
  # running this three times would only mean reading the same failure three times.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
