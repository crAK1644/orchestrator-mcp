name: release

# Publishes to PyPI when a GitHub Release is published. Authentication is
# Trusted Publishing: PyPI mints a short-lived token from this workflow's OIDC
# identity, so there is no API token stored anywhere in the repo.
#
# Actions are pinned to commit SHAs rather than tags. A tag is movable, so a
# compromised (or merely retagged) action would otherwise change what runs in a
# job that can mint a PyPI credential.
on:
  release:
    types: [published]

jobs:
  # Everything that runs project code -- dependency resolution, the test suite,
  # the build backend -- happens here, in a job with no `id-token: write`. Any of
  # it could request an OIDC token if this job could mint one, and publish a
  # substituted distribution under this project's name.
  build:
    runs-on: ubuntu-latest
    permissions:
      # Declaring this block replaces the defaults rather than extending them,
      # so checkout needs `contents: read` spelled out or it 404s on its own repo.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinning the action pins the installer, not the uv it downloads. The
          # checksum is for the x86_64 linux tarball, which is what ubuntu-latest
          # pulls; a different runner arch would need its own.
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"

      # A release that fails its own tests should not reach PyPI, and a version
      # is not withdrawable once uploaded.
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q

      # The tag must match the version in pyproject.toml, or the release notes
      # point at something PyPI does not have.
      - name: Check the tag matches the packaged version
        run: |
          packaged=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tag" ]; then
            echo "tag $tag does not match pyproject version $packaged" >&2
            exit 1
          fi

      - run: uv build

      # The check above read pyproject; this one reads the files. `uv build` writes
      # into `dist/` without emptying it first, so "something is in there" is not the
      # same claim as "the two distributions for this tag are in there, and nothing
      # else". Last place to say so while the upload is still withdrawable.
      - name: Check dist holds exactly this tag's wheel and sdist
        run: |
          version="${GITHUB_REF_NAME#v}"
          # `uv build` drops its own `.gitignore` in beside the distributions, so
          # count the things that get uploaded rather than everything present.
          built=$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)
          if [ "$built" -ne 2 ] \
            || [ ! -f "dist/orchestrator_mcp_server-${version}-py3-none-any.whl" ] \
            || [ ! -f "dist/orchestrator_mcp_server-${version}.tar.gz" ]; then
            echo "dist/ is not exactly the wheel and sdist for ${version}:" >&2
            ls -1A dist >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The only job that can mint a PyPI credential, and it runs no project code:
  # it downloads the finished distributions and uploads them. `id-token: write` is
  # job-wide -- GitHub has no step-scoped permission -- so the two actions below sit
  # inside that boundary as much as `uv publish` does. That is what the SHA pins and
  # the uv checksum are for; the boundary is the whole job, not the final line.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Named so PyPI's publisher can be narrowed to this environment. It carries no
    # protection rules, so it is an identity boundary and not an approval one:
    # publishing a Release starts the upload with nothing further to confirm. Adding
    # a required reviewer here is the switch, if that ever stops being wanted.
    environment: pypi
    permissions:
      # The OIDC token PyPI verifies. Without this the job cannot authenticate.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          # This job deliberately never checks the repo out -- it runs no project
          # code -- so there is no `pyproject.toml` to key a cache on and no working
          # tree to look at. Both defaults assume otherwise and warn. Saying so here
          # keeps the log free of two lines that describe the design, not a problem.
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      # `always` fails loudly if OIDC is unavailable, rather than falling back
      # to prompting for a password in a non-interactive runner.
      - run: uv publish --trusted-publishing always
